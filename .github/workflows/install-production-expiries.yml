name: Install production expiries

on:
  push:
    paths:
      - '.github/workflows/install-production-expiries.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create production expiry module
        run: |
          cp beta/beta-expiries-v3.js homebase-expiries-1.10.21.js
          python - <<'PY'
          from pathlib import Path
          p=Path('homebase-expiries-1.10.21.js')
          s=p.read_text()
          s=s.replace("homebase_expiries_v2","homebase_expiries_v1")
          s=s.replace("beta-v3","production-v1")
          s=s.replace("__betaExpiriesWrapped","__homebaseExpiriesWrapped")
          s=s.replace("__betaExpiriesOriginal","__homebaseExpiriesOriginal")
          p.write_text(s)
          PY
      - name: Wire modules into service worker
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('service-worker.js')
          s=p.read_text()
          s=s.replace('Homebase stable 1.10.20','Homebase stable 1.10.21')
          s=s.replace('homebase-1.10.20','homebase-1.10.21')
          if '"./backup.html"' not in s:
              s=s.replace('const SHELL=[', 'const SHELL=["./backup.html","./production-tools.js","./homebase-expiries-1.10.21.js",')
          marker='  if(scripts.length)html=html.replace("</body>",`${scripts.join("\\n")}\\n</body>`);'
          additions='  if(!html.includes("production-tools.js"))scripts.push(\'<script src="./production-tools.js?v=11021"></script>\');\n  if(!html.includes("homebase-expiries-1.10.21.js"))scripts.push(\'<script src="./homebase-expiries-1.10.21.js?v=11021"></script>\');\n'
          if 'homebase-expiries-1.10.21.js?v=11021' not in s:
              s=s.replace(marker, additions+marker)
          p.write_text(s)
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/install-production-expiries.yml
      - name: Commit installation
        run: |
          git config user.name "homebase-maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add service-worker.js production-tools.js homebase-expiries-1.10.21.js .github/workflows/install-production-expiries.yml
          git commit -m "feat: enable backups and expiries in production"
          git push
