name: Create clean Beta v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/create-beta-v2-clean.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated clean Beta v2
        shell: python
        run: |
          from pathlib import Path
          import re, json

          BUILD=2501
          VERSION='2.5.1'
          src=Path('beta/app-current.html').read_text(encoding='utf-8')

          src=src.replace('window.HOMEBASE_BETA_VERSION="2.4.0";window.HOMEBASE_BETA_LOADED_BUILD=2404;', f'window.HOMEBASE_BETA_VERSION="{VERSION}";window.HOMEBASE_BETA_LOADED_BUILD={BUILD};')
          src=re.sub(r'<title>Homebase Beta [^<]*</title>', f'<title>Homebase Beta {VERSION}</title>', src, count=1)
          src=re.sub(r'<link\s+rel=["\']manifest["\'][^>]*>', '<link rel="manifest" href="./beta-v2/manifest.webmanifest?v=2501">', src, count=1, flags=re.I)

          # Remove legacy Beta navigation/branding layers. These were fighting the canonical nav,
          # duplicating build badges and resetting the page to Hoy.
          src=re.sub(r'<script\s+src=["\']\.\/beta\/beta-bottom-nav-fix\.js[^"\']*["\']></script>', '', src)
          src=re.sub(r'<script\s+src=["\']\.\/beta\/beta-navigation-ux\.js[^"\']*["\']></script>', '', src)
          src=re.sub(r'<script>\(\(\)=>\{const apply=\(\)=>\{const img=document\.querySelector\(\'\.brand img\'\)[\s\S]*?HOMEBASE_BETA_NAVIGATION_UX[\s\S]*?</script>', '', src)

          # Remove any stale inline visible build labels from inherited Beta shell.
          src=re.sub(r'<span[^>]+id=["\'](?:betaVersionBadgeInline|betaLoadedBuildStatic|betaVersionBadge)["\'][^>]*>[\s\S]*?</span>', '', src, flags=re.I)

          # Canonical mobile navigation only.
          src=re.sub(r'<script\s+src=["\']\.\/homebase-mobile-nav-1\.10\.29\.js[^"\']*["\']></script>', '', src)
          src=src.replace('</body>', '<script src="./homebase-mobile-nav-1.10.29.js?betaV2=2501"></script></body>', 1)

          # Keep version checks inside this new independent scope.
          src=src.replace("fetch('./beta/version.json?t='+Date.now()", "fetch('./beta-v2/version.json?t='+Date.now()")
          src=src.replace("location.replace('./beta/?update='+Date.now())", "location.replace('./beta-v2/index.html?v='+v.build+'&t='+Date.now())")

          # One authoritative branding/build label, no timers that re-run navigation.
          final=f'''<script>(()=>{{
            const B={BUILD},V='{VERSION}';
            const apply=()=>{{
              window.HOMEBASE_BETA_LOADED_BUILD=B;window.HOMEBASE_BETA_VERSION=V;
              const img=document.querySelector('.brand img');if(img){{img.src='./beta/beta-icon.svg?bv2='+B;img.alt='Homebase Beta'}}
              const sub=document.querySelector('.topbar .brand-sub');if(sub)sub.textContent='Beta '+V+' · b'+B;
              document.querySelectorAll('#betaV2BuildBadge,#betaVersionBadgeInline,#betaLoadedBuildStatic,#betaVersionBadge,.beta-version-slot').forEach(n=>n.remove());
              const title=document.querySelector('.brand-title');
              if(title){{const badge=document.createElement('span');badge.id='betaV2BuildBadge';badge.textContent='b'+B;badge.style.cssText='margin-left:8px;padding:3px 8px;border-radius:999px;background:#eee8ff;color:#6f58c9;font-size:11px;font-weight:850';title.insertAdjacentElement('afterend',badge)}}
              window.HOMEBASE_MOBILE_NAV?.apply?.();
            }};
            document.readyState==='loading'?document.addEventListener('DOMContentLoaded',apply,{{once:true}}):apply();
          }})();</script>'''
          src=src.replace('</body>', final+'</body>', 1)

          # Explicitly prevent legacy Beta modules from forcing navigation after first render.
          guard='''<script>(()=>{window.HOMEBASE_BETA_CLEAN_V2=true;const keepPage=()=>{const active=document.querySelector('.page.active');if(active)sessionStorage.setItem('hb_beta_v2_page',active.id||'todayPage')};document.addEventListener('click',e=>{if(e.target.closest('.bottom-nav'))setTimeout(keepPage,0)},true);})();</script>'''
          src=src.replace('</head>',guard+'</head>',1)

          out=Path('beta-v2');out.mkdir(exist_ok=True)
          Path('beta-v2/index.html').write_text(src,encoding='utf-8')
          Path('beta-v2/version.json').write_text(json.dumps({'build':BUILD,'version':VERSION},indent=2)+'\n',encoding='utf-8')
          manifest={
            'name':'Homebase Beta Clean','short_name':'HB Beta Clean','description':f'Homebase Beta limpia · {BUILD}',
            'start_url':'./index.html?install=2501','scope':'./','display':'standalone',
            'background_color':'#f6f2fb','theme_color':'#6f58c9',
            'icons':[{'src':'../beta/beta-icon.svg?v=2501','sizes':'any','type':'image/svg+xml','purpose':'any maskable'}]
          }
          Path('beta-v2/manifest.webmanifest').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

      - name: Commit clean Beta v2
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add beta-v2/index.html beta-v2/version.json beta-v2/manifest.webmanifest
          git commit -m "Beta Clean 2501: remove legacy navigation conflicts" || exit 0
          git push
