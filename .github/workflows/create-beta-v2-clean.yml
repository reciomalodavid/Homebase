name: Create clean Beta v2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/create-beta-v2-clean.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build isolated clean Beta v2
        shell: python
        run: |
          from pathlib import Path
          import re, json

          BUILD=2503
          VERSION='2.5.3'
          src=Path('beta/app-current.html').read_text(encoding='utf-8')

          src=src.replace('window.HOMEBASE_BETA_VERSION="2.4.0";window.HOMEBASE_BETA_LOADED_BUILD=2404;', f'window.HOMEBASE_BETA_VERSION="{VERSION}";window.HOMEBASE_BETA_LOADED_BUILD={BUILD};')
          src=re.sub(r'<title>Homebase Beta [^<]*</title>', f'<title>Homebase Beta {VERSION}</title>', src, count=1)
          src=re.sub(r'<link\s+rel=["\']manifest["\'][^>]*>', f'<link rel="manifest" href="./beta-v2/manifest.webmanifest?v={BUILD}">', src, count=1, flags=re.I)

          # No service worker in Beta Clean.
          src=re.sub(r'if\("serviceWorker" in navigator&&location\.protocol==="https:"\)\{window\.addEventListener\("load",\(\)=>navigator\.serviceWorker\.register\([^\n]+\n?', '', src)

          # Remove legacy Beta navigation and the old 2404 updater/branding scripts.
          src=re.sub(r'<script\s+src=["\']\.\/beta\/beta-bottom-nav-fix\.js[^"\']*["\']></script>', '', src)
          src=re.sub(r'<script\s+src=["\']\.\/beta\/beta-navigation-ux\.js[^"\']*["\']></script>', '', src)
          src=re.sub(r'<script>\(\(\)=>\{const CURRENT=2404;[\s\S]*?</script>', '', src, count=1)
          src=re.sub(r'<script>\(\(\)=>\{const apply=\(\)=>\{const img=document\.querySelector\(\'\.brand img\'\);[\s\S]*?</script>', '', src, count=1)

          if f'homebase-mobile-nav-1.10.29.js?betaV2={BUILD}' not in src:
              src=src.replace('</body>', f'<script src="./homebase-mobile-nav-1.10.29.js?betaV2={BUILD}"></script></body>', 1)

          final=f'''<script>(()=>{{
            const B={BUILD},V='{VERSION}';
            let cleaning=false;
            const apply=()=>{{
              if(cleaning)return; cleaning=true;
              try{{
                window.HOMEBASE_BETA_LOADED_BUILD=B;window.HOMEBASE_BETA_VERSION=V;
                const brand=document.querySelector('.brand');
                if(brand){{
                  brand.querySelectorAll('*').forEach(n=>{{
                    const t=(n.textContent||'').trim();
                    if(/^b\\d{{3,6}}$/i.test(t) && n.id!=='betaV2BuildBadge') n.remove();
                  }});
                  const img=brand.querySelector('img');
                  if(img){{img.src='/Homebase/beta/beta-icon.svg?bv2='+B;img.alt='Homebase Beta';img.onerror=null;}}
                  let badge=document.getElementById('betaV2BuildBadge');
                  if(!badge){{
                    badge=document.createElement('span');badge.id='betaV2BuildBadge';
                    badge.style.cssText='margin-left:8px;padding:3px 8px;border-radius:999px;background:#eee8ff;color:#6f58c9;font-size:11px;font-weight:850';
                    const title=brand.querySelector('.brand-title');title?.insertAdjacentElement('afterend',badge);
                  }}
                  if(badge)badge.textContent='b'+B;
                }}
                const sub=document.querySelector('.topbar .brand-sub');if(sub)sub.textContent='Beta '+V+' · b'+B;
                document.querySelectorAll('.beta-version-slot,#betaVersionBadgeInline,#betaLoadedBuildStatic,#betaVersionBadge').forEach(n=>n.remove());
                window.HOMEBASE_MOBILE_NAV?.apply?.();
              }} finally {{cleaning=false}}
            }};
            const start=()=>{{
              apply();setTimeout(apply,150);setTimeout(apply,500);
              const top=document.querySelector('.topbar');
              if(top)new MutationObserver(()=>requestAnimationFrame(apply)).observe(top,{{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:['src']}});
            }};
            document.readyState==='loading'?document.addEventListener('DOMContentLoaded',start,{{once:true}}):start();
          }})();</script>'''
          src=src.replace('</body>', final+'</body>', 1)

          # One update probe only against the current build. No self-reload loop.
          early=f'''<script>(()=>{{const CURRENT={BUILD};setTimeout(async()=>{{try{{const r=await fetch('./beta-v2/version.json?t='+Date.now(),{{cache:'no-store'}});if(!r.ok)return;const v=await r.json();if(Number(v.build)>CURRENT)location.replace('./beta-v2/index.html?v='+v.build+'&t='+Date.now())}}catch{{}}}},3000)}})();</script>'''
          src=src.replace('</head>', early+'</head>', 1)

          out=Path('beta-v2');out.mkdir(exist_ok=True)
          Path('beta-v2/index.html').write_text(src,encoding='utf-8')
          Path('beta-v2/version.json').write_text(json.dumps({'build':BUILD,'version':VERSION},indent=2)+'\n',encoding='utf-8')
          manifest={
            'name':'Homebase Beta Clean','short_name':'HB Beta Clean','description':f'Homebase Beta limpia · {BUILD}',
            'start_url':f'./index.html?install={BUILD}','scope':'./','display':'standalone',
            'background_color':'#f6f2fb','theme_color':'#6f58c9',
            'icons':[{'src':'../beta/beta-icon.svg?v='+str(BUILD),'sizes':'any','type':'image/svg+xml','purpose':'any maskable'}]
          }
          Path('beta-v2/manifest.webmanifest').write_text(json.dumps(manifest,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

      - name: Commit clean Beta v2
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add beta-v2/index.html beta-v2/version.json beta-v2/manifest.webmanifest
          git commit -m "Beta Clean 2503: clean header branding" || exit 0
          git push
