name: Wire production modules

on:
  push:
    paths:
      - '.github/workflows/wire-production-modules.yml'

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add module injection
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('service-worker.js')
          lines=p.read_text().splitlines()
          additions=[
            ' if(!html.includes("production-tools.js"))scripts.push(\'<script src="./production-tools.js?v=11021"></script>\');',
            ' if(!html.includes("homebase-expiries-1.10.21.js"))scripts.push(\'<script src="./homebase-expiries-1.10.21.js?v=11021"></script>\');'
          ]
          if not any('homebase-expiries-1.10.21.js?v=11021' in line for line in lines):
            index=next(i for i,line in enumerate(lines) if 'if(scripts.length)html=html.replace' in line)
            lines[index:index]=additions
          p.write_text('\n'.join(lines)+'\n')
          PY
      - name: Remove workflow and commit
        run: |
          rm .github/workflows/wire-production-modules.yml
          git config user.name "homebase-maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add service-worker.js .github/workflows/wire-production-modules.yml
          git commit -m "fix: load production backup and expiry modules"
          git push
