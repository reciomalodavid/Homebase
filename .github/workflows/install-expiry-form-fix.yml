name: Install expiry form hotfix

on:
  push:
    paths:
      - '.github/workflows/install-expiry-form-fix.yml'

permissions:
  contents: write

jobs:
  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire hotfix into service worker
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('service-worker.js')
          s=p.read_text()
          s=s.replace('Homebase stable 1.10.21','Homebase stable 1.10.22')
          s=s.replace('homebase-1.10.21','homebase-1.10.22')
          if '"./homebase-expiry-form-fix-1.10.22.js"' not in s:
              s=s.replace('const SHELL=[', 'const SHELL=["./homebase-expiry-form-fix-1.10.22.js",')
          line=' if(!html.includes("homebase-expiry-form-fix-1.10.22.js"))scripts.push(\'<script src="./homebase-expiry-form-fix-1.10.22.js?v=11022"></script>\');\n'
          if 'homebase-expiry-form-fix-1.10.22.js?v=11022' not in s:
              marker=' if(scripts.length)html=html.replace("</body>",`${scripts.join("\\n")}\\n</body>`);'
              s=s.replace(marker,line+marker)
          p.write_text(s)
          PY
      - name: Remove workflow and commit
        run: |
          rm .github/workflows/install-expiry-form-fix.yml
          git config user.name "homebase-maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add service-worker.js .github/workflows/install-expiry-form-fix.yml
          git commit -m "fix: activate expiry form close behavior"
          git push