name: Homebase Beta sync verification

on:
  push:
    branches: [firebase-beta-separation]
    paths:
      - .github/workflows/firebase-homebase-beta-sync-check.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify-beta-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/986505930709/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-firebase-beta@homebase-beta-72767.iam.gserviceaccount.com
      - name: Verify TEST MIGRACION reached Beta Firestore
        shell: bash
        run: |
          set -euo pipefail
          PROJECT='homebase-beta-72767'
          DOC='BETA_BT83TFR4U9'
          test "$(gcloud config get-value project 2>/dev/null)" = "$PROJECT"
          TOKEN="$(gcloud auth print-access-token)"
          URL="https://firestore.googleapis.com/v1/projects/${PROJECT}/databases/(default)/documents/homebaseSyncs/${DOC}"
          BODY="$(curl -fsS -H "Authorization: Bearer ${TOKEN}" "$URL")"
          node -e '
            const doc=JSON.parse(process.env.BODY);
            const walk=v=>{
              if(!v||typeof v!=="object") return false;
              if(v.stringValue==="TEST MIGRACION") return true;
              return Object.values(v).some(walk);
            };
            if(!walk(doc.fields||{})){
              console.error("TEST MIGRACION not found in target Beta Firestore document");
              process.exit(1);
            }
            console.log("Beta sync verified: TEST MIGRACION found in homebase-beta-72767");
          '
        env:
          BODY: ${{ env.BODY }}
