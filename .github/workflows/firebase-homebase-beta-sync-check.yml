name: Homebase Beta sync verification

on:
  push:
    branches: [firebase-beta-separation]
    paths:
      - .github/workflows/firebase-homebase-beta-sync-check.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  verify-beta-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: projects/986505930709/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: github-firebase-beta@homebase-beta-72767.iam.gserviceaccount.com
      - name: Diagnose Beta home bootstrap
        shell: bash
        run: |
          set -euo pipefail
          PROJECT='homebase-beta-72767'
          DOC='BETA_BT83TFR4U9'
          test "$(gcloud config get-value project 2>/dev/null)" = "$PROJECT"
          TOKEN="$(gcloud auth print-access-token)"
          URL="https://firestore.googleapis.com/v1/projects/${PROJECT}/databases/(default)/documents/homebaseSyncs/${DOC}"
          HTTP="$(curl -sS -o /tmp/homebase-beta-doc.json -w '%{http_code}' -H "Authorization: Bearer ${TOKEN}" "$URL")"
          echo "Target project: ${PROJECT}"
          echo "Home document HTTP: ${HTTP}"
          if [ "$HTTP" != "200" ]; then
            echo "Home document does not exist or is not readable by admin API."
            exit 1
          fi
          node - <<'NODE'
          const fs=require('fs');
          const doc=JSON.parse(fs.readFileSync('/tmp/homebase-beta-doc.json','utf8'));
          const fields=doc.fields||{};
          const members=fields.authorizedUids?.arrayValue?.values||[];
          const walk=v=>{
            if(!v||typeof v!=="object") return false;
            if(v.stringValue==="TEST MIGRATION 2") return true;
            return Object.values(v).some(walk);
          };
          console.log(`authorizedUids count: ${members.length}`);
          console.log(`TEST MIGRATION 2 present: ${walk(fields)?'yes':'no'}`);
          console.log(`items field present: ${fields.items?'yes':'no'}`);
          if(!members.length) process.exit(2);
          NODE
