<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#eef6fd">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Homebase Beta">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Homebase Beta 2.3</title>
<style>html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#eef6fd;color:#1d1d1f}.loader{min-height:100vh;display:grid;place-items:center;padding:28px;text-align:center}.box{max-width:360px;padding:24px;border-radius:24px;background:rgba(255,255,255,.78);border:1px solid rgba(255,255,255,.95);box-shadow:0 18px 46px rgba(45,94,139,.12)}.b{width:46px;height:46px;margin:0 auto 14px;border-radius:14px;background:linear-gradient(135deg,#6f58c9,#9477df);display:grid;place-items:center;color:#fff;font-weight:900}.box small{display:block;margin-top:8px;color:#657789}</style>
</head>
<body>
<div class="loader"><div class="box"><div class="b">B</div><strong>Cargando Homebase Beta 2.3…</strong><small>Módulo de vencimientos reconstruido.</small></div></div>
<script>
(async()=>{try{
 const response=await fetch('../index.html?beta23clean='+Date.now(),{cache:'no-store'});
 if(!response.ok)throw new Error('No se pudo cargar Homebase');
 let html=await response.text();
 html=html.replace(/<head>/i,'<head><base href="../">');
 html=html.replace(/<title>[^<]*<\/title>/i,'<title>Homebase Beta 2.3</title>');
 html=html.replace(/<meta\s+name=["']viewport["'][^>]*>/i,'<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">');
 html=html.replace(/<link\s+rel=["']manifest["'][^>]*>/i,'');
 html=html.replace(/<link\s+rel=["']apple-touch-icon["'][^>]*>/i,'');
 html=html.replace(/let\s+code\s*=\s*["']HB["']/,'let code="BT"');
 html=html.replace(/collection\(["']homebaseSyncs["']\)\.doc\(code\)/g,'collection("homebaseSyncs").doc("BETA_"+code)');
 html=html.replace(/collection\(["']homebaseSyncs["']\)\.doc\(state\.syncCode\)/g,'collection("homebaseSyncs").doc("BETA_"+state.syncCode)');
 html=html.replaceAll('./service-worker.js','./beta/service-worker-disabled.js');
 html=html.replace('<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"><\/script>','<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"><\/script><script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"><\/script>');
 const isolation=`<script>(()=>{
 const P='homebase_beta2__',SYNC='homebase_sync_code',ANCHOR='homebase_beta2_sync_code_anchor';
 const proto=Storage.prototype;
 if(!proto.__homebaseBetaIsolationV2){
   const g=proto.getItem,s=proto.setItem,r=proto.removeItem,L=x=>x===localStorage;
   Object.defineProperty(proto,'__homebaseBetaIsolationV2',{value:true,configurable:false});
   window.HOMEBASE_BETA_RAW_STORAGE={get:key=>g.call(localStorage,key),set:(key,value)=>s.call(localStorage,key,value),remove:key=>r.call(localStorage,key)};
   const rawCanonical=g.call(localStorage,P+SYNC);
   const rawDouble=g.call(localStorage,P+P+SYNC);
   const rawAnchor=g.call(localStorage,ANCHOR);
   const recovered=rawCanonical||rawDouble||rawAnchor||'';
   if(recovered){s.call(localStorage,P+SYNC,recovered);s.call(localStorage,ANCHOR,recovered);}
   proto.getItem=function(a){
     if(!L(this))return g.call(this,a);
     if(a===SYNC){const anchored=g.call(this,ANCHOR);if(anchored)return anchored;}
     return g.call(this,P+a);
   };
   proto.setItem=function(a,b){
     if(!L(this))return s.call(this,a,b);
     if(a===SYNC&&b){s.call(this,ANCHOR,String(b));}
     return s.call(this,P+a,b);
   };
   proto.removeItem=function(a){
     if(!L(this))return r.call(this,a);
     if(a===SYNC)r.call(this,ANCHOR);
     return r.call(this,P+a);
   };
 }
 window.HOMEBASE_BETA=true;window.HOMEBASE_BETA_AUTH_REQUIRED=true;window.HOMEBASE_BETA_VERSION='2.3-storage-safe';window.HOMEBASE_BETA_LOADED_BUILD=2314;
})();<\/script>`;
 html=html.replace(/<head>/i,'<head>'+isolation);
 html=html.replace('if(state.syncCode){startCloudListener();refreshWhenActive()}','if(state.syncCode&&!window.HOMEBASE_BETA_AUTH_REQUIRED){startCloudListener();refreshWhenActive()}');
 const css=['homebase-ui-1.8.3.css','homebase-fixes-1.9.2.css','homebase-quality-1.9.7.css','homebase-apple-glass-1.10.2.css','homebase-shell-1.10.3.css'].map(f=>`<link rel="stylesheet" href="./${f}?beta23clean=1">`).join('')+'<link rel="stylesheet" href="./beta/beta-theme-2.3.css?beta23clean=1">';
 html=html.replace('</head>',css+'</head>');
 const scripts=['homebase-ui-1.8.3.js','roster-sync-fix.js','homebase-quality-1.9.7.js','homebase-shell-1.10.3.js'].map(f=>`<script src="./${f}?beta23clean=1"><\/script>`).join('');
 const extras=[
  'beta/beta-security-auth.js?v=5',
  'beta/beta-security-pairing-ui.js?v=1',
  'beta/beta-cloud-db-bridge.js?v=1',
  'beta/beta-member-photos.js?v=5',
  'beta/beta-backup-tools.js?v=3',
  'beta/beta-expiries-v3.js?v=2',
  'beta/beta-profile-enhancements.js?v=5',
  'beta/beta-profile-birthdays.js?v=1',
  'beta/beta-calendar-jump.js?v=8',
  'beta/beta-stability-fixes.js?v=3',
  'beta/beta-quick-add.js?v=7',
  'beta/beta-navigation-ux.js?v=2',
  'beta/beta-birthdays.js?v=2',
  'beta/beta-external-birthday-display.js?v=2',
  'beta/beta-voice-assistant.js?v=4',
  'beta/beta-bottom-nav-fix.js?v=2',
  'beta/beta-update-checker.js?v=5'
 ].map(src=>`<script src="./${src}"><\/script>`).join('');
 const brand=`<script>(()=>{const apply=()=>{const img=document.querySelector('.brand img');if(img){img.src='./beta/beta-icon.svg?beta23clean=1';img.alt='Homebase Beta';}};document.readyState==='loading'?document.addEventListener('DOMContentLoaded',apply,{once:true}):apply();})();<\/script>`;
 html=html.replace('</body>',scripts+extras+brand+'</body>');
 document.open();document.write(html);document.close();
}catch(error){document.body.innerHTML='<div class="loader"><div class="box"><div class="b">!</div><strong>No se pudo cargar la beta</strong><small>'+String(error.message||error)+'</small></div></div>';console.error(error)}})();
</script>
</body>
</html>
