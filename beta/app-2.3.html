<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#eef6fd">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Homebase Beta">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>Homebase Beta 2.3</title>
<style>html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#eef6fd;color:#1d1d1f}.loader{min-height:100vh;display:grid;place-items:center;padding:28px;text-align:center}.box{max-width:360px;padding:24px;border-radius:24px;background:rgba(255,255,255,.78);border:1px solid rgba(255,255,255,.95);box-shadow:0 18px 46px rgba(45,94,139,.12)}.b{width:46px;height:46px;margin:0 auto 14px;border-radius:14px;background:linear-gradient(135deg,#6f58c9,#9477df);display:grid;place-items:center;color:#fff;font-weight:900}.box small{display:block;margin-top:8px;color:#657789}</style>
</head>
<body>
<div class="loader"><div class="box"><div class="b">B</div><strong>Cargando Homebase Beta 2.3…</strong><small>Recuperación limpia.</small></div></div>
<script>
(async()=>{try{
 const response=await fetch('../index.html?beta23clean='+Date.now(),{cache:'no-store'});
 if(!response.ok)throw new Error('No se pudo cargar Homebase');
 let html=await response.text();
 html=html.replace(/<head>/i,'<head><base href="../">');
 html=html.replace(/<title>[^<]*<\/title>/i,'<title>Homebase Beta 2.3</title>');
 html=html.replace(/<meta\s+name=["']viewport["'][^>]*>/i,'<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">');
 html=html.replace(/<link\s+rel=["']manifest["'][^>]*>/i,'');
 html=html.replace(/<link\s+rel=["']apple-touch-icon["'][^>]*>/i,'');
 html=html.replace(/let\s+code\s*=\s*["']HB["']/,'let code="BT"');
 html=html.replace(/collection\(["']homebaseSyncs["']\)\.doc\(code\)/g,'collection("homebaseSyncs").doc("BETA_"+code)');
 html=html.replace(/collection\(["']homebaseSyncs["']\)\.doc\(state\.syncCode\)/g,'collection("homebaseSyncs").doc("BETA_"+state.syncCode)');
 html=html.replaceAll('./service-worker.js','./beta/service-worker-disabled.js');
 const isolation=`<script>(()=>{const P='homebase_beta2__',g=Storage.prototype.getItem,s=Storage.prototype.setItem,r=Storage.prototype.removeItem,L=x=>x===localStorage;Storage.prototype.getItem=function(a){return g.call(this,L(this)?P+a:a)};Storage.prototype.setItem=function(a,b){return s.call(this,L(this)?P+a:a,b)};Storage.prototype.removeItem=function(a){return r.call(this,L(this)?P+a:a)};window.HOMEBASE_BETA=true;window.HOMEBASE_BETA_VERSION='2.3';})();<\/script>`;
 html=html.replace(/<head>/i,'<head>'+isolation);
 const css=['homebase-ui-1.8.3.css','homebase-fixes-1.9.2.css','homebase-quality-1.9.7.css','homebase-apple-glass-1.10.2.css','homebase-shell-1.10.3.css'].map(f=>`<link rel="stylesheet" href="./${f}?beta23clean=1">`).join('')+'<link rel="stylesheet" href="./beta/beta-theme-2.3.css?clean=1">';
 html=html.replace('</head>',css+'</head>');
 const scripts=['homebase-ui-1.8.3.js','roster-sync-fix.js','homebase-quality-1.9.7.js','homebase-shell-1.10.3.js'].map(f=>`<script src="./${f}?beta23clean=1"><\/script>`).join('');
 const memberPhotos='<script src="./beta/beta-member-photos.js?v=2"><\/script>';
 const expiries='<script src="./beta/beta-expiries-v1.js?v=4"><\/script>';
 const expiryUiFixes='<script src="./beta/beta-expiry-ui-fixes.js?v=1"><\/script>';
 const profileEnhancements='<script src="./beta/beta-profile-enhancements.js?v=2"><\/script>';
 const calendarJump='<script src="./beta/beta-calendar-jump.js?v=3"><\/script>';
 const brand=`<script>(()=>{const apply=()=>{const img=document.querySelector('.brand img');if(img){img.src='./beta/beta-icon.svg?clean=1';img.alt='Homebase Beta';}};document.readyState==='loading'?document.addEventListener('DOMContentLoaded',apply,{once:true}):apply();})();<\/script>`;
 html=html.replace('</body>',scripts+memberPhotos+expiries+expiryUiFixes+profileEnhancements+calendarJump+brand+'</body>');
 document.open();document.write(html);document.close();
}catch(error){document.body.innerHTML='<div class="loader"><div class="box"><div class="b">!</div><strong>No se pudo cargar la beta</strong><small>'+String(error.message||error)+'</small></div></div>';console.error(error)}})();
</script>
</body>
</html>
