<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#eef6fd">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Homebase Beta">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="manifest" href="./manifest.webmanifest?v=260">
<link rel="apple-touch-icon" href="./beta-icon.svg?v=260">
<title>Homebase Beta 2.6</title>
<style>html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#eef6fd;color:#1d1d1f}.loader{min-height:100vh;display:grid;place-items:center;padding:28px;text-align:center}.box{max-width:360px;padding:24px;border-radius:24px;background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.92);box-shadow:0 18px 46px rgba(45,94,139,.12);backdrop-filter:blur(28px)}.b{width:46px;height:46px;margin:0 auto 14px;border-radius:14px;background:linear-gradient(135deg,#6f58c9,#9477df);display:grid;place-items:center;color:#fff;font-weight:900}.box small{display:block;margin-top:8px;color:#657789}</style>
</head>
<body>
<div class="loader"><div class="box"><div class="b">B</div><strong>Cargando Homebase Beta 2.6…</strong><small>Aplicando un único sistema de apariencia.</small></div></div>
<script>
(async()=>{try{
 if('serviceWorker'in navigator){for(const r of await navigator.serviceWorker.getRegistrations())if(r.scope.includes('/Homebase/beta/'))await r.unregister()}
 if('caches'in window){for(const k of await caches.keys())if(/homebase|beta/i.test(k))await caches.delete(k)}
 const res=await fetch('../index.html?beta26='+Date.now(),{cache:'no-store'});if(!res.ok)throw Error('No se pudo cargar la estable');
 let html=await res.text();
 html=html.replace(/<head>/i,'<head><base href="../">');
 html=html.replace(/<title>[^<]*<\/title>/i,'<title>Homebase Beta 2.6</title>');
 html=html.replace(/<meta\s+name=["']viewport["'][^>]*>/i,'<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">');
 html=html.replace(/<meta\s+name=["']apple-mobile-web-app-title["'][^>]*>/i,'<meta name="apple-mobile-web-app-title" content="Homebase Beta">');
 html=html.replace(/<meta\s+name=["']apple-mobile-web-app-status-bar-style["'][^>]*>/i,'<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">');
 html=html.replace(/<meta\s+name=["']theme-color["'][^>]*>/i,'<meta name="theme-color" content="#eef6fd">');
 html=html.replace(/<link\s+rel=["']manifest["'][^>]*>/i,'<link rel="manifest" href="./beta/manifest.webmanifest?v=260">');
 html=html.replace(/<link\s+rel=["']apple-touch-icon["'][^>]*>/i,'<link rel="apple-touch-icon" href="./beta/beta-icon.svg?v=260">');
 html=html.replace(/let\s+code\s*=\s*["']HB["']/,'let code="BT"');
 html=html.replace(/collection\(["']homebaseSyncs["']\)\.doc\(code\)/g,'collection("homebaseSyncs").doc("BETA_"+code)');
 html=html.replace(/collection\(["']homebaseSyncs["']\)\.doc\(state\.syncCode\)/g,'collection("homebaseSyncs").doc("BETA_"+state.syncCode)');
 html=html.replaceAll('./service-worker.js','./beta/service-worker.js?v=260');
 const isolation=`<script>(()=>{const P='homebase_beta2__',g=Storage.prototype.getItem,s=Storage.prototype.setItem,r=Storage.prototype.removeItem,k=Storage.prototype.key,L=x=>x===localStorage;Storage.prototype.getItem=function(a){return g.call(this,L(this)?P+a:a)};Storage.prototype.setItem=function(a,b){return s.call(this,L(this)?P+a:a,b)};Storage.prototype.removeItem=function(a){return r.call(this,L(this)?P+a:a)};Storage.prototype.key=function(i){const a=k.call(this,i);return L(this)&&a?.startsWith(P)?a.slice(P.length):a};window.HOMEBASE_BETA=true;window.HOMEBASE_BETA_VERSION='2.6';})();<\/script>`;
 html=html.replace(/<head>/i,'<head>'+isolation);
 const css=['homebase-ui-1.8.3.css','homebase-fixes-1.9.2.css','homebase-quality-1.9.7.css','homebase-apple-glass-1.10.2.css','homebase-shell-1.10.3.css'].map(f=>`<link rel="stylesheet" href="./${f}?beta=260">`).join('');
 html=html.replace('</head>',css+'</head>');
 const scripts=['homebase-ui-1.8.3.js','roster-sync-fix.js','homebase-quality-1.9.7.js','homebase-shell-1.10.3.js'].map(f=>`<script src="./${f}?beta=260"><\/script>`).join('');
 const brand=`<script>(()=>{const a=()=>{const i=document.querySelector('.brand img');if(i){i.src='./beta/beta-icon.svg?v=260';i.alt='Homebase Beta'}};document.readyState==='loading'?document.addEventListener('DOMContentLoaded',a,{once:true}):a()})();<\/script>`;
 const gestures=`<script>(()=>{const stop=e=>e.preventDefault();['gesturestart','gesturechange','gestureend'].forEach(n=>document.addEventListener(n,stop,{passive:false}));let e=0;document.addEventListener('touchend',x=>{const n=Date.now();if(n-e<320)x.preventDefault();e=n},{passive:false})})();<\/script>`;
 const runtime='<script src="./beta/beta-theme-runtime-2.6.js?v=260"><\/script>';
 html=html.replace('</body>',scripts+brand+gestures+runtime+'</body>');
 document.open();document.write(html);document.close();
}catch(e){document.body.innerHTML='<div class="loader"><div class="box"><div class="b">!</div><strong>No se pudo cargar la beta</strong><small>'+String(e.message||e)+'</small></div></div>';console.error(e)}})();
</script>
</body>
</html>
