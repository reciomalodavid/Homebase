<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#eef6fd">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Homebase Beta">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="manifest" href="./manifest.webmanifest?v=240">
<link rel="apple-touch-icon" href="./beta-icon.svg?v=240">
<title>Homebase Beta 2.4</title>
<style>
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#eef6fd;color:#1d1d1f}.loader{min-height:100vh;display:grid;place-items:center;padding:28px;text-align:center}.box{max-width:360px;padding:24px;border-radius:24px;background:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.92);box-shadow:0 18px 46px rgba(45,94,139,.12);backdrop-filter:blur(28px)}.b{width:46px;height:46px;margin:0 auto 14px;border-radius:14px;background:linear-gradient(135deg,#6f58c9,#9477df);display:grid;place-items:center;color:#fff;font-weight:900}.box small{display:block;margin-top:8px;color:#657789}@media(prefers-color-scheme:dark){html,body{background:#08111e;color:#f7f9fc}.box{background:rgba(27,38,55,.82);border-color:rgba(255,255,255,.10)}.box small{color:#aeb9c8}}
</style>
</head>
<body>
<div class="loader"><div class="box"><div class="b">B</div><strong>Cargando Homebase Beta 2.4…</strong><small>Aplicando el tema completo.</small></div></div>
<script>
(async()=>{
 try{
  if('serviceWorker' in navigator){const regs=await navigator.serviceWorker.getRegistrations();for(const reg of regs){if(reg.scope.includes('/Homebase/beta/'))await reg.unregister();}}
  if('caches' in window){for(const key of await caches.keys()){if(/homebase|beta/i.test(key))await caches.delete(key);}}
  const response=await fetch('../index.html?beta24='+Date.now(),{cache:'no-store'});
  if(!response.ok)throw new Error('No se pudo cargar la estable');
  let html=await response.text();
  html=html.replace(/<head>/i,'<head><base href="../">');
  html=html.replace(/<title>[^<]*<\/title>/i,'<title>Homebase Beta 2.4</title>');
  html=html.replace(/<meta\s+name=["']viewport["'][^>]*>/i,'<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">');
  html=html.replace(/<meta\s+name=["']apple-mobile-web-app-title["'][^>]*>/i,'<meta name="apple-mobile-web-app-title" content="Homebase Beta">');
  html=html.replace(/<meta\s+name=["']apple-mobile-web-app-status-bar-style["'][^>]*>/i,'<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">');
  html=html.replace(/<meta\s+name=["']theme-color["'][^>]*>/i,'<meta name="theme-color" content="#eef6fd">');
  html=html.replace(/<link\s+rel=["']manifest["'][^>]*>/i,'<link rel="manifest" href="./beta/manifest.webmanifest?v=240">');
  html=html.replace(/<link\s+rel=["']apple-touch-icon["'][^>]*>/i,'<link rel="apple-touch-icon" href="./beta/beta-icon.svg?v=240">');
  html=html.replace(/let\s+code\s*=\s*["']HB["']/,'let code="BT"');
  html=html.replace(/collection\(["']homebaseSyncs["']\)\.doc\(code\)/g,'collection("homebaseSyncs").doc("BETA_"+code)');
  html=html.replace(/collection\(["']homebaseSyncs["']\)\.doc\(state\.syncCode\)/g,'collection("homebaseSyncs").doc("BETA_"+state.syncCode)');
  html=html.replaceAll('./service-worker.js','./beta/service-worker.js?v=240');
  const isolation=`<script data-beta-isolation>(()=>{const P='homebase_beta2__',g=Storage.prototype.getItem,s=Storage.prototype.setItem,r=Storage.prototype.removeItem,k=Storage.prototype.key,L=x=>x===localStorage;Storage.prototype.getItem=function(a){return g.call(this,L(this)?P+a:a)};Storage.prototype.setItem=function(a,b){return s.call(this,L(this)?P+a:a,b)};Storage.prototype.removeItem=function(a){return r.call(this,L(this)?P+a:a)};Storage.prototype.key=function(i){const a=k.call(this,i);return L(this)&&a?.startsWith(P)?a.slice(P.length):a};window.HOMEBASE_BETA=true;window.HOMEBASE_BETA_VERSION='2.4';})();<\/script>`;
  html=html.replace(/<head>/i,'<head>'+isolation);
  const css=['homebase-ui-1.8.3.css','homebase-fixes-1.9.2.css','homebase-quality-1.9.7.css','homebase-apple-glass-1.10.2.css','homebase-shell-1.10.3.css'].map(f=>`<link rel="stylesheet" href="./${f}?beta=240">`).join('')+'<link rel="stylesheet" href="./beta/beta-theme-2.3.css?v=240">';
  html=html.replace('</head>',css+'</head>');
  const scripts=['homebase-ui-1.8.3.js','roster-sync-fix.js','homebase-quality-1.9.7.js','homebase-shell-1.10.3.js'].map(f=>`<script src="./${f}?beta=240"><\/script>`).join('');
  const betaBrand=`<script>(()=>{const apply=()=>{const img=document.querySelector('.brand img');if(img){img.src='./beta/beta-icon.svg?v=240';img.alt='Homebase Beta';}};if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',apply,{once:true});else apply();})();<\/script>`;
  const gestures=`<script>(()=>{const stop=e=>e.preventDefault();['gesturestart','gesturechange','gestureend'].forEach(n=>document.addEventListener(n,stop,{passive:false}));let end=0;document.addEventListener('touchend',e=>{const n=Date.now();if(n-end<320)e.preventDefault();end=n},{passive:false});let sx=0,sy=0,lx=0,ly=0,axis='',on=false;document.addEventListener('touchstart',e=>{if(e.touches.length!==1||!e.target.closest?.('.calendar-shell')){on=false;return}const t=e.touches[0];sx=lx=t.clientX;sy=ly=t.clientY;axis='';on=true},{passive:true});document.addEventListener('touchmove',e=>{if(!on||e.touches.length!==1)return;const t=e.touches[0];lx=t.clientX;ly=t.clientY;const x=lx-sx,y=ly-sy;if(!axis&&Math.max(Math.abs(x),Math.abs(y))>6)axis=Math.abs(x)>Math.abs(y)*1.05?'x':'y';if(axis==='x')e.preventDefault()},{passive:false});document.addEventListener('touchend',()=>{if(!on)return;on=false;const x=lx-sx,y=ly-sy;if(axis!=='x'||Math.abs(x)<28||Math.abs(x)<Math.abs(y)*1.05)return;const b=[...document.querySelectorAll('.calendar-top>button')];(x<0?b.at(-1):b[0])?.click()},{passive:true});})();<\/script>`;
  const darkRuntime='<script src="./beta/beta-dark-runtime-2.4.js?v=240"><\/script>';
  html=html.replace('</body>',scripts+betaBrand+gestures+darkRuntime+'</body>');
  document.open();document.write(html);document.close();
 }catch(error){document.body.innerHTML='<div class="loader"><div class="box"><div class="b">!</div><strong>No se pudo cargar la beta</strong><small>'+String(error.message||error)+'</small></div></div>';console.error(error)}
})();
</script>
</body>
</html>
