<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="theme-color" content="#6f58c9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Homebase Beta">
<link rel="manifest" href="./manifest.webmanifest?v=2368">
<title>Homebase Beta 2.3</title>
<style>html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#eef6fd;color:#1d1d1f}.wrap{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}.card{padding:22px;border-radius:22px;background:white;box-shadow:0 16px 40px rgba(45,94,139,.13)}small{display:block;margin-top:8px;color:#6f7d8a}</style>
</head>
<body>
<div class="wrap"><div class="card"><strong>Abriendo Homebase Beta 2.3…</strong><small>Actualizando Beta de forma segura</small></div></div>
<script>
(async()=>{
  try{
    if('serviceWorker' in navigator){
      const registrations=await navigator.serviceWorker.getRegistrations();
      for(const registration of registrations){
        const scriptUrl=registration.active?.scriptURL||registration.waiting?.scriptURL||registration.installing?.scriptURL||'';
        const scope=registration.scope||'';
        const isLegacyBeta=scriptUrl.includes('/Homebase/beta/service-worker.js')||scope.endsWith('/Homebase/beta/');
        if(isLegacyBeta) await registration.unregister();
      }
    }
    if('caches' in window){
      const names=await caches.keys();
      await Promise.all(names.filter(name=>name.startsWith('homebase-beta-')).map(name=>caches.delete(name)));
    }
  }catch(error){console.warn('Beta legacy cache cleanup',error)}
  location.replace('./app-2.3.html?recovery=2368');
})();
</script>
</body>
</html>
