<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#eef6fd">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Homebase Beta">
<link rel="manifest" href="./manifest.webmanifest?v=202">
<link rel="apple-touch-icon" href="./beta-icon.svg?v=202">
<title>Homebase Beta 2.0</title>
<style>
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(180deg,#f5faff,#eef6fd 48%,#e7f2fc);color:#1d1d1f}.loader{min-height:100vh;display:grid;place-items:center;padding:28px;text-align:center}.box{max-width:360px;padding:24px;border-radius:24px;background:rgba(255,255,255,.68);border:1px solid rgba(255,255,255,.92);box-shadow:0 18px 46px rgba(45,94,139,.12);backdrop-filter:blur(28px)}.b{width:46px;height:46px;margin:0 auto 14px;border-radius:14px;background:linear-gradient(135deg,#6f58c9,#9477df);display:grid;place-items:center;color:#fff;font-weight:900}.box small{display:block;margin-top:8px;color:#657789}
@media(prefers-color-scheme:dark){html,body{background:linear-gradient(180deg,#101827,#0c1421 58%,#09111d);color:#f7f9fc}.box{background:rgba(27,38,55,.72);border-color:rgba(255,255,255,.09);box-shadow:0 20px 54px rgba(0,0,0,.30)}.box small{color:rgba(255,255,255,.58)}}
</style>
</head>
<body>
<div class="loader"><div class="box"><div class="b">B</div><strong>Cargando Homebase Beta 2.0…</strong><small>Copia funcional de la versión estable.</small></div></div>
<script>
(async()=>{
 try{
  if('serviceWorker' in navigator){
   const regs=await navigator.serviceWorker.getRegistrations();
   for(const reg of regs){if(reg.scope.includes('/Homebase/beta/'))await reg.unregister();}
  }
  const response=await fetch('../index.html?beta2='+Date.now(),{cache:'no-store'});
  if(!response.ok)throw new Error('No se pudo cargar la estable');
  let html=await response.text();

  html=html.replace(/<head>/i,'<head><base href="../">');
  html=html.replace(/<title>[^<]*<\/title>/i,'<title>Homebase Beta 2.0</title>');
  html=html.replace(/<meta\s+name=["']viewport["'][^>]*>/i,'<meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">');
  html=html.replace(/<meta\s+name=["']apple-mobile-web-app-title["'][^>]*>/i,'<meta name="apple-mobile-web-app-title" content="Homebase Beta">');
  html=html.replace(/<meta\s+name=["']theme-color["'][^>]*>/i,'<meta name="theme-color" content="#eef6fd">');
  html=html.replace(/<link\s+rel=["']manifest["'][^>]*>/i,'<link rel="manifest" href="./beta/manifest.webmanifest?v=202">');
  html=html.replace(/<link\s+rel=["']apple-touch-icon["'][^>]*>/i,'<link rel="apple-touch-icon" href="./beta/beta-icon.svg?v=202">');

  html=html.replace(/let\s+code\s*=\s*["']HB["']/,'let code="BT"');
  html=html.replace(/collection\(["']homebaseSyncs["']\)\.doc\(code\)/g,'collection("homebaseSyncs").doc("BETA_"+code)');
  html=html.replace(/collection\(["']homebaseSyncs["']\)\.doc\(state\.syncCode\)/g,'collection("homebaseSyncs").doc("BETA_"+state.syncCode)');
  html=html.replaceAll('./service-worker.js','./beta/service-worker.js?v=202');

  const isolation=`<script data-beta-isolation>(()=>{const P='homebase_beta2__',g=Storage.prototype.getItem,s=Storage.prototype.setItem,r=Storage.prototype.removeItem,k=Storage.prototype.key,L=x=>x===localStorage;Storage.prototype.getItem=function(a){return g.call(this,L(this)?P+a:a)};Storage.prototype.setItem=function(a,b){return s.call(this,L(this)?P+a:a,b)};Storage.prototype.removeItem=function(a){return r.call(this,L(this)?P+a:a)};Storage.prototype.key=function(i){const a=k.call(this,i);return L(this)&&a?.startsWith(P)?a.slice(P.length):a};window.HOMEBASE_BETA=true;window.HOMEBASE_BETA_VERSION='2.0';})();<\/script>`;
  html=html.replace(/<head>/i,'<head>'+isolation);

  const css=[
   'homebase-ui-1.8.3.css','homebase-fixes-1.9.2.css','homebase-quality-1.9.7.css','homebase-apple-glass-1.10.2.css','homebase-shell-1.10.3.css'
  ].map(f=>`<link rel="stylesheet" href="./${f}?beta=202">`).join('');
  html=html.replace('</head>',css+'</head>');

  const betaCss=`<style data-beta-theme>
  :root{--beta-purple:#6f58c9;--bg:#eef6fd!important;--surface:rgba(255,255,255,.70)!important;--surface-2:rgba(244,249,254,.78)!important;--line:rgba(91,139,181,.14)!important;--shadow:0 14px 38px rgba(45,94,139,.10)!important}
  html,body{background:radial-gradient(circle at 7% 2%,rgba(255,255,255,.94),transparent 30%),radial-gradient(circle at 96% 8%,rgba(170,218,255,.30),transparent 34%),linear-gradient(180deg,#f5faff 0%,#eef6fd 48%,#e7f2fc 100%)!important;background-attachment:fixed!important;-webkit-text-size-adjust:100%;touch-action:manipulation}
  body::before{background:rgba(238,246,253,.88)!important}.topbar,.bottom-nav,.card,.calendar-shell,dialog,.today-focus,.today-stats{background:rgba(255,255,255,.64)!important;border-color:rgba(255,255,255,.88)!important;box-shadow:0 14px 38px rgba(45,94,139,.10)!important;-webkit-backdrop-filter:blur(28px) saturate(170%)!important;backdrop-filter:blur(28px) saturate(170%)!important}.topbar{background:rgba(242,249,255,.74)!important}.bottom-nav{background:rgba(247,251,255,.78)!important}.event-row,.task-row,.detail-row,.switch-line{border-color:rgba(91,139,181,.13)!important}.icon-btn,.row-action,.calendar-top>button,.close{background:rgba(255,255,255,.76)!important}.calendar-shell{overscroll-behavior-x:contain}
  .new-btn{display:none!important}
  body::after{content:'BETA 2.0';position:fixed;top:calc(7px + env(safe-area-inset-top));right:9px;z-index:9999;padding:5px 9px;border-radius:999px;background:rgba(111,88,201,.95);color:#fff;font:800 10px/1 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;letter-spacing:.7px;box-shadow:0 5px 16px rgba(68,48,122,.22);pointer-events:none}.brand-title::after{content:' Beta';color:var(--beta-purple);font-size:.58em;font-weight:850}

  @media(prefers-color-scheme:dark){
    :root{--bg:#0b1320!important;--surface:rgba(25,35,50,.64)!important;--surface-2:rgba(34,45,61,.66)!important;--text:#f7f9fc!important;--muted:rgba(235,241,248,.62)!important;--line:rgba(255,255,255,.075)!important;--shadow:0 18px 46px rgba(0,0,0,.20)!important;--accent-soft:rgba(217,120,31,.18)!important}
    html,body{background:radial-gradient(circle at 12% -6%,rgba(64,112,170,.22),transparent 33%),radial-gradient(circle at 94% 3%,rgba(111,88,201,.20),transparent 31%),linear-gradient(180deg,#111c2c 0%,#0d1725 48%,#09111d 100%)!important;color:#f7f9fc!important}
    body::before{background:rgba(9,17,29,.72)!important}
    .topbar,.bottom-nav,.card,.calendar-shell,dialog,.today-focus,.today-stats,.list-card,.roster-card{background:linear-gradient(145deg,rgba(35,47,65,.68),rgba(22,31,45,.58))!important;border-color:rgba(255,255,255,.075)!important;box-shadow:0 18px 44px rgba(0,0,0,.16)!important;-webkit-backdrop-filter:blur(30px) saturate(145%)!important;backdrop-filter:blur(30px) saturate(145%)!important}
    .topbar{background:rgba(24,35,51,.72)!important;border-color:rgba(255,255,255,.09)!important}
    .bottom-nav{background:rgba(20,30,44,.72)!important;border:1px solid rgba(255,255,255,.08)!important;box-shadow:0 18px 44px rgba(0,0,0,.24)!important}
    .bottom-nav .nav-btn{color:rgba(255,255,255,.58)!important}
    .bottom-nav .nav-btn.active{color:#ff9a3d!important;background:rgba(255,255,255,.075)!important}
    .icon-btn,.row-action,.calendar-top>button,.close,.profile-edit,.profile-upload,.profile-remove{background:rgba(255,255,255,.075)!important;color:#f7f9fc!important;border-color:rgba(255,255,255,.08)!important}
    .today-focus,.today-stats{background:linear-gradient(145deg,rgba(31,43,61,.74),rgba(20,29,43,.64))!important}
    .today-stat,.profile-row,.profile-form,.all-day,.week-board,.time-event,.empty,.sync-details,.switch-line{background:rgba(255,255,255,.055)!important}
    .event-row,.task-row,.detail-row,.switch-line,.duty-segment{border-color:rgba(255,255,255,.07)!important}
    .event-title,.task-title,.roster-title,.sync-summary-title,.section-head h2,.hero-row h1,.today-focus-title,.today-stat strong,.calendar-title,.week-name,.week-num,.modal h2,.modal-head h2,.detail-grid strong{color:#f7f9fc!important}
    .event-meta,.roster-sub,.sync-summary-sub,.hero-date,.section-head span,.today-focus-meta,.today-stat span,.weekdays div,.time-label,.detail-grid span,.empty,.profile-kind,.profile-group-title{color:rgba(235,241,248,.60)!important}
    input,select,textarea{background:rgba(255,255,255,.075)!important;color:#f7f9fc!important;border-color:rgba(255,255,255,.09)!important}
    input::placeholder,textarea::placeholder{color:rgba(235,241,248,.38)!important}
    .type-switch,.mode-switch,.sync-summary,.profile-form,.advanced{background:rgba(255,255,255,.05)!important}
    .type-switch button,.mode-switch button{color:rgba(255,255,255,.52)!important}
    .type-switch button.active,.mode-switch button.active{background:rgba(255,255,255,.11)!important;color:#fff!important;box-shadow:none!important}
    .day{background:rgba(255,255,255,.055)!important;color:#f7f9fc!important;box-shadow:none!important}
    .day.other{opacity:.32!important}
    .day.today{background:rgba(217,120,31,.14)!important;outline-color:rgba(255,154,61,.72)!important}
    .day.selected{background:linear-gradient(180deg,#df7c27,#c86616)!important;color:#fff!important;outline-color:rgba(255,255,255,.38)!important}
    .calendar-shell,.week-board,.timeline,.week-bottom-space{background-color:transparent!important}
    .week-head,.all-day,.timeline,.day-col,.time-col{border-color:rgba(255,255,255,.07)!important}
    .timeline{background:repeating-linear-gradient(to bottom,transparent 0,transparent 59px,rgba(255,255,255,.07) 59px,rgba(255,255,255,.07) 60px)!important}
    dialog::backdrop{background:rgba(2,7,14,.64)!important;backdrop-filter:blur(10px)!important}
    .save,.event-fab,.roster-primary,.primary{box-shadow:0 12px 28px rgba(225,118,19,.26)!important}
    .badge{border-color:#111c2c!important}
    body::after{background:rgba(126,99,218,.96)!important;box-shadow:0 6px 18px rgba(0,0,0,.28)!important}
  }
  </style>`;
  html=html.replace('</head>',betaCss+'</head>');

  const scripts=[
   'homebase-ui-1.8.3.js','roster-sync-fix.js','homebase-quality-1.9.7.js','homebase-shell-1.10.3.js'
  ].map(f=>`<script src="./${f}?beta=202"><\/script>`).join('');

  const betaBrand=`<script data-beta-brand>(()=>{const apply=()=>{const img=document.querySelector('.brand img');if(img){img.src='./beta/beta-icon.svg?v=202';img.alt='Homebase Beta';}};if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',apply,{once:true});else apply();})();<\/script>`;

  const gestures=`<script data-beta-runtime>(()=>{const stop=e=>e.preventDefault();['gesturestart','gesturechange','gestureend'].forEach(n=>document.addEventListener(n,stop,{passive:false}));let end=0;document.addEventListener('touchend',e=>{const n=Date.now();if(n-end<320)e.preventDefault();end=n},{passive:false});let sx=0,sy=0,lx=0,ly=0,axis='',on=false;document.addEventListener('touchstart',e=>{if(e.touches.length!==1||!e.target.closest?.('.calendar-shell')){on=false;return}const t=e.touches[0];sx=lx=t.clientX;sy=ly=t.clientY;axis='';on=true},{passive:true});document.addEventListener('touchmove',e=>{if(!on||e.touches.length!==1)return;const t=e.touches[0];lx=t.clientX;ly=t.clientY;const x=lx-sx,y=ly-sy;if(!axis&&Math.max(Math.abs(x),Math.abs(y))>6)axis=Math.abs(x)>Math.abs(y)*1.05?'x':'y';if(axis==='x')e.preventDefault()},{passive:false});document.addEventListener('touchend',()=>{if(!on)return;on=false;const x=lx-sx,y=ly-sy;if(axis!=='x'||Math.abs(x)<28||Math.abs(x)<Math.abs(y)*1.05)return;const b=[...document.querySelectorAll('.calendar-top>button')];(x<0?b.at(-1):b[0])?.click()},{passive:true});document.addEventListener('touchcancel',()=>{on=false;axis=''},{passive:true});})();<\/script>`;
  html=html.replace('</body>',scripts+betaBrand+gestures+'</body>');

  document.open();document.write(html);document.close();
 }catch(error){document.body.innerHTML='<div class="loader"><div class="box"><div class="b">!</div><strong>No se pudo cargar la beta</strong><small>'+String(error.message||error)+'</small></div></div>';console.error(error)}
})();
</script>
</body>
</html>
